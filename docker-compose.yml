services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botop
      POSTGRES_PASSWORD: botop
      POSTGRES_DB: botop
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U botop -d botop']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
